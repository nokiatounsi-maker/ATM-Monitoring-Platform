name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore AtmMonitoringPlatform.slnx

    - name: Build
      run: dotnet build AtmMonitoringPlatform.slnx --configuration ${{ matrix.configuration }} --no-restore

    - name: Test
      run: dotnet test AtmMonitoringPlatform.slnx --configuration ${{ matrix.configuration }} --no-build
